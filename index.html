  let value;

    let saved = null;
    for (const key of profile.keys) {
      saved = localStorage.getItem(key);
      if (saved) break;
    }
    value = profile.field ? JSON.parse(saved || '{}')?.[profile.field] : saved;
  } catch (_) { /* The application also follows the system when storage cannot be read. */ }

  const selected = value === 'light' || value === 'dark' ? value : '';
  if (selected) return {selected, theme: selected};
  let theme = profile.default || 'light';
  if (typeof matchMedia === 'function') {
    if (matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark';
    else if (matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
  }
  return {selected, theme};
}

&lt;style&gt;
/* ===== 디자인 토큰 ===== */

html { height: 100%; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 150px); -webkit-text-size-adjust: 100%; }

.helpbtn { display: flex; align-items: center; justify-content: center; flex: none; box-sizing: border-box; width: 37px; height: 37px; border: 1.5px solid var(--ink); border-radius: 50%; color: var(--ink); text-decoration: none; line-height: 0; transition: background-color .2s ease; }

.tseg .opt + .opt { width: 36.5px; border-left: 1.5px solid var(--ink); }

/* ===== 버튼 ===== */

.now .nxt .bl { font: 400 17px/1 &quot;Segoe UI Symbol&quot;, &quot;Apple Symbols&quot;, &quot;Noto Sans Symbols&quot;, &quot;Noto Sans Symbols 2&quot;, var(--ui-font), sans-serif; color: var(--ink); }

.chart { --per: 4; }
.empty-msg { padding: 28px 14px; color: var(--pencil); }
.line { display: grid; grid-template-columns: 36px minmax(0, 1fr); }
.line + .line { margin-top: 2px; }
.line + .line.kp { margin-top: 5px; }   /* 검은 알약(top -4px)이 윗줄 템포 줄(틀·흰 알약)에 닿지 않게 */
.line .num { font-size: 11.5px; color: var(--pencil); text-align: right; padding: 8px 8px 0 0; font-variant-numeric: tabular-nums; }
.bars { position: relative; display: grid; grid-template-columns: repeat(var(--per), minmax(0, 1fr)); border-left: 1.5px solid var(--rule); }
/* 지금 코드 상자(형광펜): 지금 울리는 코드가 시작하는 박부터 다음 코드가 시작하는 곳까지, 끌어 두는 동안은 다음 마디까지 이어 감쌈.
   줄마다 하나(줄을 넘는 코드는 줄마다 한 조각), 자리와 폭은 frame()이 스프링으로 옮김. 마디보다 먼저 그려 글자·빗금 아래에 깔림 */
.cbox { position: absolute; left: 0; top: 9px; height: 40px; width: 0; display: none; background: var(--box); border-radius: 9px; pointer-events: none; overflow: hidden; }
/* 진행 채움(주황): 코드 시작부터 재생 위치까지 진행 막대처럼 참. 자리·폭은 fillBoxes()가 매 프레임(상자가 둥근 모서리로 자름).
   어두운 테마 채움(#5e3110)은 밝은 잉크 9.1:1, 회색 이름 5.05:1: 채움·상자·차트 면 어디서나 같은 글자색이 읽힘(상자와는 색조로 구별) */
.cbox .cfill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--fill); }
/* 어두운 테마의 상자(#4b4219, 차트 면과 1.65:1)는 밝은 잉크 8.4:1, 회색 이름(#aab1bb) 4.6:1. 상자가 스프링으로 움직이는 동안이나 두 줄 마디에서
   이름이 상자 밖으로 나가도 글자색이 배경과 어긋나지 않게, 상자 안이라고 글자색을 바꾸지 않음(모든 이름이 상자 위와 차트 면 위 어디서나 4.5:1 이상) */
.bar { position: relative; height: 86px; border-right: 1.5px solid var(--rule); cursor: pointer; outline-offset: -2px; }
.bar:hover { background: var(--hover); }
.bar.final { border-right: none; }
.bar.final::after { content: &quot;&quot;; position: absolute; right: 0; top: 0; bottom: 0; width: 7px; border-left: 1.5px solid var(--ink); border-right: 4px solid var(--ink); }
.lane, .slashes { position: absolute; left: 12px; right: 10px; }
.lane { top: 12px; height: 34px; z-index: 1; }
.slashes { bottom: 14px; height: 18px; }
.chord { position: absolute; top: 0; white-space: nowrap; font-family: var(--chord-font); font-weight: 700; font-size: 25px; line-height: 34px; letter-spacing: -.01em; color: var(--ink); }
.chord .q { font-size: .8em; }
.chord sup { font-size: .6em; vertical-align: .62em; line-height: 0; margin-left: 1px; }
.chord .bs { font-size: .8em; color: inherit; }
.chord .rq { font-size: .62em; vertical-align: .6em; line-height: 0; margin-left: 1px; }
.chord .fig { display: inline-flex; flex-direction: column; align-items: center; font-size: .47em; line-height: .98; vertical-align: .95em; margin: 0 1px 0 2px; }
.chord .sec { font-size: .8em; }
.chord.sm { font-size: 19px; }
.chord.xs { font-size: 15px; }
.chord.xxs { font-size: 12px; }
.chord.xxxs { font-size: 10px; }
.chord.r1, .chord.r2 { line-height: 17px; height: 17px; }   /* 두 줄로 놓은 마디: 위 줄 0~17px, 아래 줄 17~34px(레인 높이 안). 15px 이하에서 첨자까지 제 줄 안 */
.chord.r2 { top: 17px; }
.chord.cut { overflow: hidden; }   /* 가장 작은 크기로도 안 들어가는 이름(폭은 max-width, 전체 이름은 title). &quot;…&quot;은 줄인 꼴에 직접 붙임 */
.chord.tied { color: var(--soft); font-weight: 600; }
.chord.nc { font-family: var(--ui-font); font-size: 14px; font-weight: 600; color: var(--soft); letter-spacing: .02em; }
.chord.nc.sm { font-size: 13px; } .chord.nc.xs { font-size: 12px; } .chord.nc.xxs { font-size: 11px; } .chord.nc.xxxs { font-size: 10px; }   /* N.C.도 크기 단계를 따름(두 줄 마디 등) */
.chord .more { font-size: .75em; letter-spacing: -.05em; margin-left: .5px; }   /* 줄인 이름 끝 &quot;…&quot;(좁게) */
#chart.still .chord { transition: none !important; }   /* 차트를 다시 그린 첫 프레임: 확대를 애니메이션 없이 */
/* 지금 울리는 코드 이름: 들어올 때 0.1초에 확 커지고, 다음 코드로 넘어가면 0.7초에 걸쳐 서서히 줄어듦(전환은 도착 상태의 것을 씀).
   배율(--zs)은 layoutChords가 다음 이름까지 남은 자리로 정해 옆 이름과 겹치지 않음. 왼쪽을 축으로 커져 박 자리는 그대로.
   한 줄 마디는 위아래로 나눠 커져(높이 45% 축) 윗줄 알약과 재생 중 커지는 빗금에 닿지 않고, 두 줄 마디는 위 끝을 축으로 */
.chord { transform-origin: 0 45%; transition: transform .7s cubic-bezier(.35, 0, .25, 1); }
.chord.r1, .chord.r2 { transform-origin: 0 0; }
.chord.zoom { transform: scale(var(--zs, 1)); transition: transform .1s cubic-bezier(.2, .8, .3, 1); }
.slashes i { position: absolute; bottom: 0; width: 3.5px; height: 15px; margin-left: 5px; background: var(--pencil); border-radius: 1px; transform: skewX(-24deg); opacity: .5; }
.slashes i.off { height: 8px; width: 2.5px; opacity: .3; }
.bar.cur .slashes i { opacity: .8; }
/* 코드를 새로 치는 박(검은 글자 코드가 놓인 박·작은박)의 빗금: 두껍고 진하게. 가운데는 보통 빗금과 같은 자리(코드 이름 정렬 유지) */
.slashes i.ch { width: 6.5px; margin-left: 3.5px; opacity: .9; }
.slashes i.off.ch { width: 4.5px; margin-left: 4px; height: 11px; opacity: .9; }
.bar.cur .slashes i.ch { opacity: 1; }
.slashes i.hit { background: var(--ink); opacity: 1 !important; height: 19px; }
/* 통기타 스트로크 기호(1.14.0, 통기타를 켰을 때만): 코드 이름(지금 코드 상자 아래 끝 49px)과 빗금 사이 칸. 다운 Π·업 V는 그 박 자리 빗금 가운데
   (칸 왼쪽 + 6.5px)에, 뮤트 구간은 처음~끝 기호를 잇는 꺾쇠(양 끝이 아래로 꺾임) 위 가운데에 M. 켜면 마디를 칸만큼 높임(빗금·템포 줄은 아래에 그대로) */
.bar .gm { display: none; position: absolute; left: 12px; right: 10px; top: 44px; height: 22px; pointer-events: none; }
#chart.gm .bar { height: 106px; }
#chart.gm .bar .gm { display: block; }
/* 기호는 글꼴과 상관없이 같은 꼴로 그림(clip-path로 자른 색 면): 다운 ⊓(위 막대 굵게), 업 V. 글자(Π·V)는 접근성 트리에서 빠진 칸 안에만 */
.gm .sd { position: absolute; bottom: 1px; width: 9px; height: 8px; margin-left: 2px; font-size: 0; transform-origin: 50% 100%; background: var(--pencil); clip-path: polygon(0 0, 100% 0, 100% 100%, 82% 100%, 82% 30%, 18% 30%, 18% 100%, 0 100%); }
.gm .sd.up { height: 9px; clip-path: polygon(0 0, 19% 0, 50% 76%, 81% 0, 100% 0, 59% 100%, 41% 100%); }
.gm .sd.ck { height: 8px; clip-path: polygon(0 14%, 14% 0, 50% 36%, 86% 0, 100% 14%, 64% 50%, 100% 86%, 86% 100%, 50% 64%, 14% 100%, 0 86%, 36% 50%); }
.gm .rk { position: absolute; bottom: 0; width: 5px; height: 15px; margin-left: -4px; transform-origin: 50% 100%; background: var(--pencil); clip-path: polygon(0 0, 30% 0, 100% 17%, 100% 25%, 30% 42%, 100% 58%, 100% 67%, 30% 83%, 100% 100%, 70% 100%, 0 83%, 0 75%, 70% 58%, 0 42%, 0 33%, 70% 17%); }   /* 느린 긁기(아르페지오 물결선) */
.bar.cur .gm .sd, .bar.cur .gm .rk { background: var(--ink); }
.gm .mb { position: absolute; top: 10px; height: 2px; border-top: 1.2px solid var(--pencil); }
.gm .mb.l { border-left: 1.2px solid var(--pencil); }
.gm .mb.r { border-right: 1.2px solid var(--pencil); }
.gm .mb i { position: absolute; left: 50%; bottom: 100%; margin-bottom: 0; transform: translateX(-50%); font: 800 11px/10px var(--ui-font); font-style: normal; color: var(--ink); }   /* 글자라 마우스를 올린 마디(--hover)에서도 4.5:1 넘게 잉크색 */
.bar.cur .gm .mb, .bar.cur .gm .mb i { border-color: var(--ink); color: var(--ink); }
/* 1.26.1 일렉 기타 악보: 팜뮤트 묶음은 점선 꺾쇠 위 P.M.(기타 악보 표기), 데드 뮤트는 ×(묶지 않음) */
.gm .mb.pm { border-top-style: dashed; }
.gm .mb.one, .bar.cur .gm .mb.one { border: 0; }   /* 한 박짜리 뮤트: 꺾쇠 없이 글자만 */
.gm .mb.pm i { font-size: 10px; letter-spacing: -.02em; }
/* 1.26.1 드럼 악보(드럼을 켰을 때만, 기호 ○⊛*⊝⊜●◒◕−=O): 통기타 칸이 없으면 그 자리(코드 이름 아래 50px)에, 통기타와 함께면 통기타 줄 아래(72px~)에 한 줄 더.
   기호는 그 칸 자리 빗금 가운데(칸 왼쪽 + 6.5px)에 가운데 맞춤. 글꼴은 기호가 다 든 것 먼저(섞이면 크기가 들쭉날쭉) */
.bar .dm { display: none; position: absolute; left: 12px; right: 10px; top: 50px; height: 22px; pointer-events: none; }
#chart.dm .bar { height: 106px; }
#chart.dm .bar .dm { display: block; }
#chart.gm.dm .bar { height: 124px; }
#chart.gm.dm .bar .dm { top: 72px; height: 18px; }
.dm b { position: absolute; bottom: 1px; margin-left: 6.5px; transform: translateX(-50%); font: 400 16px/16px &quot;Segoe UI Symbol&quot;, &quot;Apple Symbols&quot;, &quot;DejaVu Sans&quot;, &quot;Noto Sans Math&quot;, &quot;Noto Sans Symbols 2&quot;, &quot;Noto Sans Symbols&quot;, var(--ui-font); color: var(--pencil); white-space: nowrap; }
.bar.cur .dm b { color: var(--ink); }
/* 1.26.2 드럼 줄 진행: 형광펜 같은 연보라 띠가 마디 처음부터 재생 위치까지 차오름(코드 상자의 주황 채움처럼). 기호는 그 위에 */
.dm .dhl { position: absolute; left: -6px; top: -2px; bottom: -3px; width: 0; max-width: calc(100% + 12px); background: var(--dfocus); border-radius: 6px; }
/* 1.26.2 가장 최근에 친 드럼 기호 확대: 코드 이름(.chord.zoom)과 같은 때·빠르기(0.1초에 커지고 0.7초에 줄어듦), 아래 가운데 축 */
.dm b { transform-origin: 50% 95%; transition: transform .35s cubic-bezier(.35, 0, .25, 1), color .2s ease-out; }   /* 1.26.4 드럼 기호 확대는 0.075초에 커지고 0.35초에 줄어듦 */
/*  지금 친 기호는 크게(1.9배, 위에 그림), 다음 기호는 아주 조금(1.2배), 다다음은 더 조금(1.07배) */
.dm b.zoom, .bar.cur .dm b.zoom { transform: translateX(-50%) scale(1.9); color: var(--dhit); transition: transform .075s cubic-bezier(.2, .8, .3, 1), color .05s ease-out; z-index: 2; }   /* 1.26.3 지금 친 드럼은 빨강, 1.26.4 빨강은 0.05초에 들어오고 0.2초에 빠짐(확대는 0.1초·0.7초 그대로) */
.dm b.z1 { transform: translateX(-50%) scale(1.2); transition: transform .075s cubic-bezier(.2, .8, .3, 1); z-index: 1; }
.dm b.z2 { transform: translateX(-50%) scale(1.07); transition: transform .075s cubic-bezier(.2, .8, .3, 1); }
#chart.still .dm b { transition: none !important; }
/* 1.26.3 기타와 드럼을 함께 켜면 드럼 기호는 위쪽을 축으로 아래로 커지고(위의 기타 스트로크 기호를 가리지 않게), 기타 기호 줄은 드럼 줄 위에 그림 */
#chart.gm.dm .bar .gm { z-index: 3; }
#chart.gm.dm .dm b { transform-origin: 50% 45%; }
/*  함께 켜면 위(기타 기호)·아래(박 빗금) 둘 다 닿지 않게 확대를 줄임 */
#chart.gm.dm .dm b.zoom { transform: translateX(-50%) scale(1.35); }
#chart.gm.dm .dm b.z1 { transform: translateX(-50%) scale(1.15); }
#chart.gm.dm .dm b.z2 { transform: translateX(-50%) scale(1.05); }
@media (prefers-reduced-motion: reduce) { .dm b, .dm b.zoom, .dm b.z1, .dm b.z2 { transition: none; } }
.bar .tag { position: absolute; right: 12px; top: -1px; font-size: 10.5px; line-height: 13px; color: var(--pencil); font-variant-numeric: tabular-nums; padding: 0 3px; border-radius: 3px; }   /* 상자 아래 끝이 코드 칸 위(12px)를 넘지 않게. 바탕은 비워 지금 코드 상자 윗변을 가리지 않음 */
.bar.pickup .tag { right: auto; left: 10px; }
.bar .pillrow { position: absolute; top: -4px; z-index: 3; display: flex; gap: 4px; }
.bar .pillrow .keychg { position: static; }
/* 서서히 바뀌는 템포: 슬래시 아래 줄의 긴 육각형(삼각형 + 사각형 몸통 + 삼각형). 재생 중엔 지나온 만큼 형광펜 색으로 참 */
.bar .ramp { position: absolute; bottom: 0; height: 13px; z-index: 2; display: flex; align-items: stretch; }
.bar .ramp .tip { flex: none; width: 7px; height: 13px; overflow: visible; }
.bar .ramp .tip .tb { fill: var(--sheet); }
.bar .ramp .tip .tf { fill: var(--hl); }
.bar .ramp .tip .tl { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-linejoin: round; }
.bar .ramp .rb { position: relative; flex: 1; min-width: 0; box-sizing: border-box; border-top: 1.2px solid var(--ink); border-bottom: 1.2px solid var(--ink); background: var(--sheet); overflow: hidden; display: flex; align-items: center; justify-content: center; }
.bar .ramp .rf { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--hl); }
.bar .ramp .rt { position: relative; z-index: 1; font: 800 9.5px/10px var(--ui-font); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
/* 템포: 슬래시 아래 줄에 흰 알약(조성 이름표는 검은 알약). 도착 알약은 도착 박에 잠깐 형광펜 색으로 켜짐(페이드 없음) */
.bar .tempochg { position: absolute; bottom: 0; z-index: 3; margin-left: -1px; box-sizing: border-box; height: 13px; font: 800 9.5px/10.6px var(--ui-font); padding: 0 5px; border-radius: 99px; background: var(--sheet); color: var(--ink); border: 1.2px solid var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar .tempochg.lit { background: var(--hl); color: var(--hl-ink); }
.bar .keychg { position: absolute; top: -4px; z-index: 3; font: 700 10.5px/16px var(--ui-font); padding: 0 7px; border-radius: 99px; background: var(--ink); color: var(--paper); white-space: nowrap; letter-spacing: -.01em; }

/* ===== 텍스트 차트, 정보 ===== */
textarea { box-sizing: border-box; width: 100%; min-height: 246px; resize: vertical; border-radius: 10px; border: 1px solid var(--rule); background: var(--paper); padding: 12px; font: 13px/1.6 ui-monospace, &quot;SF Mono&quot;, Menlo, Consolas, &quot;D2Coding&quot;, monospace; white-space: pre; overflow: auto; }   /* 안쪽 여백·테두리까지 100% 안에(패널 오른쪽 테두리를 넘지 않게) */
.row-end { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; align-items: center; }
.copied { font-size: 13px; color: var(--pencil); }
.info { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; font-size: 13.5px; margin: 0; }
.info dt { color: var(--pencil); }
.info dd { margin: 0; font-variant-numeric: tabular-nums; word-break: keep-all; overflow-wrap: anywhere; }   /* 한국어는 낱말 단위로 줄바꿈(너무 긴 낱말만 끊음) */
.keys { font-size: 12.5px; color: var(--pencil); margin: 18px 0 0; }
kbd { font: 600 11.5px/1 var(--ui-font); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 5px; padding: 2px 6px; background: var(--sheet); color: var(--ink); }

/* ===== 드롭 가림막 ===== */
.veil { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: color-mix(in srgb, var(--paper) 82%, transparent); pointer-events: none; }
.veil div { padding: 22px 28px; border: 2px dashed var(--ink); border-radius: 16px; font-weight: 700; background: var(--sheet); }

/* ===== 좁은 화면 ===== */
@media (max-width: 640px) {
  .wrap { padding: 0 12px 40px; }
  .top { padding: 10px 12px 4px; }
  .tp { gap: 8px 10px; }
  .clock { font-size: 14px; }
  .leds i { width: 10px; height: 10px; }
  .leds i.down { width: 13px; height: 13px; }
  .play { width: 48px; height: 48px; }
  .now { min-width: 0; }
  .now .cur { font-size: 26px; }
  .tp .vols-wide { display: none; }
  /* 1.26.0 볼륨 다섯(음악·클릭·피아노·기타·드럼): 한 줄이면 슬라이더가 너무 짧아(481px에서 30~45px) 두 칸 격자로. 음악은 맨 위 한 줄을 다 쓰고
     클릭·피아노 / 기타·드럼이 두 줄 두 칸. 이름 칸 폭을 같게(3em) 해서 모든 줄의 슬라이더 시작이 맞음 */
  .vols-narrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 18px; margin-top: 12px; }
  .vols-narrow label { display: grid; grid-template-columns: 3em minmax(0, 1fr); gap: 6px; min-width: 0; white-space: nowrap; }
  .vols-narrow label:first-child { grid-column: 1 / -1; }
  .vols-narrow input[type=range] { width: 100%; min-width: 0; }
  .ovrow { gap: 8px; }
  .toggles { gap: 6px; }
  .toggle { padding: 0; width: 44px; height: 44px; justify-content: center; }
  .toggle .lbl { display: none; }
  .toggle svg { width: 20px; height: 20px; }
  .leds { gap: 4px; }
  .now { gap: 8px; }

  .bar .dm { top: 47px; height: 21px; }
  #chart.dm .bar { height: 101px; }
  #chart.gm.dm .bar { height: 119px; }
  #chart.gm.dm .bar .dm { top: 68px; height: 18px; }

  .chord.sm { font-size: 16px; }

  .chord.xxxs { font-size: 10px; }

  .chord.r2 { top: 16px; }
  .grp { grid-template-columns: minmax(0, 1fr); gap: 6px; }   /* 긴 선택 상자가 칸을 넓히지 않게 */

@media (max-width: 760px) {
  .toggle { padding: 0; width: 44px; height: 44px; justify-content: center; }
  .toggle .lbl { display: none; }
  .toggle svg { width: 20px; height: 20px; }

body { display: flex; flex-direction: column; }
body &gt; header, body &gt; main, body &gt; footer { width: 100%; flex-shrink: 0; }
body &gt; main { flex: 1 0 auto; }

.disclaimer { max-width: 1100px; margin: 0 auto; padding: 6px 20px 24px; text-align: center; font-size: 12.5px; line-height: 1.5; color: var(--foot); word-break: keep-all; overflow-wrap: break-word; }   /* 한국어는 낱말 단위로 줄바꿈 */
.disclaimer .rights { margin: 6px 0 0; text-wrap: balance; }
.disclaimer a { color: inherit; text-decoration: none; }
.disclaimer a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

.infohelp a:hover { color: var(--ink); }

            &lt;span class=&quot;note&quot;&gt;위쪽의 피아노·통기타 버튼으로 인식한 코드를 들려줍니다(둘 다 켜면 함께 칩니다). 원곡과 겹쳐 들으면 코드가 맞는지 귀로 확인할 수 있습니다. 피아노는 여기서 고른 때에 칩니다. 자동(기본)은 곡을 연 뒤 원곡의 리듬을 보고, 박이 흔들리거나(루바토) 박마다 치는 소리가 드물면 곡 따라, 박이 꾸준하고 원곡이 박 사이에서 바쁘면 싱어송라이터, 박 사이에 여유가 있으면 개성 있게로 칩니다. 싱어송라이터·개성 있게는 밴드 피아니스트처럼 칩니다. 싱어송라이터는 구간 크기에 맞춘 리듬 꼴(화음과 윗 두 음·아래 두 음을 박 위와 엇박에 섞음) 위주로, 개성 있게는 펼침화음과 구절 끝 런 위주로 치고, 가장 큰 구간은 윗음을 옥타브로 겹친 화음, 조용한 곳은 두 손으로 이어 쓸어 올리는 펼침(피아노만일 때)입니다. 같은 코드 진행이 다시 나오면 같은 꼴로 치고, 구간 이음매와 구간이 커지기 앞에서는 다음 코드를 당겨 치며 올라가고, 어울리는 코드에는 9도 색을 넣습니다. 통기타를 함께 켜면 오른손은 통기타보다 높은 음역에서 통기타 스트로크를 피해 칩니다.&lt;/span&gt;

            &lt;/select&gt;
            &lt;select id=&quot;selGuitarMode&quot; aria-label=&quot;통기타가 치는 방식&quot;&gt;
              &lt;option value=&quot;auto&quot;&gt;자동(곡의 리듬으로 싱어송라이터·스트로크 따라 가운데 고름)&lt;/option&gt;
              &lt;option value=&quot;ssw&quot;&gt;싱어송라이터(곡에 맞춘 반주)&lt;/option&gt;
              &lt;option value=&quot;strum&quot;&gt;스트로크 따라(원곡 리듬대로)&lt;/option&gt;
              &lt;option value=&quot;beat4&quot;&gt;4비트 스트럼&lt;/option&gt;
              &lt;option value=&quot;beat8&quot;&gt;8비트 스트럼&lt;/option&gt;
              &lt;option value=&quot;beat16&quot;&gt;16비트 스트럼&lt;/option&gt;
              &lt;option value=&quot;swing&quot;&gt;스윙 스트럼&lt;/option&gt;
            &lt;/select&gt;
            &lt;span class=&quot;note&quot;&gt;자동(기본)은 곡을 연 뒤 원곡의 리듬을 보고, 원곡의 스트럼 꼴이 마디마다 되풀이되거나 박이 흔들리면 스트로크 따라, 꼴이 마디마다 바뀌면 싱어송라이터로 칩니다. 싱어송라이터는 통기타 반주자처럼 곡의 템포·느낌으로 8분·16분·셋잇단 손을 정하고, 곡에 맞는 스트럼 그루브(예: &lt;span class=&quot;nw&quot;&gt;↓ ↓↑ ↑↓↑&lt;/span&gt;)를 골라 조용한 구간은 성기게, 큰 구간은 촘촘하게 치며, 되풀이되는 구간은 같게 칩니다. 스트로크 따라는 원곡에서 기타 등을 친 리듬을 찾아 그 자리에서 다운·업으로 칩니다. 4·8·16비트는 기타 교본에서 배우는 스트럼 변주(예: 8비트 &lt;span class=&quot;nw&quot;&gt;↓ ↓↑ ↑↓↑&lt;/span&gt;) 가운데 마디마다 원곡 리듬에 가장 잘 맞는 것을 골라 곡의 박에 맞춰 칩니다. 스윙은 박마다 8분음표 둘을 길게·짧게(셋잇단 첫째·셋째, &lt;span class=&quot;nw&quot;&gt;↓·↑ ↓·↑&lt;/span&gt;) 치고, 원곡이 스윙이면 그 비율을 재서 맞춥니다. 코드가 바뀌는 곳에서는 늘 새 코드로 칩니다. 일렉 기타(밴드)를 고르면 같은 방식으로 밴드 리듬 기타처럼 파워 코드(근음·5도·옥타브)를 디스토션 앰프 소리로 칩니다: 조용한 구간은 팜뮤트 8분 연타, 큰 구간은 열린 파워 코드, 커지기 전 마디는 몰아치기, 다음 코드를 반 박 앞당기기도 하고, 노래가 없는 도입·간주에서 원곡의 기타 리프가 되풀이되면 그 음을 채보해 따라 칩니다(믿을 만할 때만, 스테레오 곡).&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
